spring.application.name=middleware

# ==========================================
# RABBITMQ CONFIGURATION
# ==========================================
# Connects dynamically to CloudAMQP or uses your fallback local/cloud URL
spring.rabbitmq.addresses=${RABBITMQ_URL:amqps://xonssbey:nkHeBNRYjIfn3PPDuWy9iFM7BCIYoyCa@horse.lmq.cloudamqp.com/xonssbey}

# Application Custom Queue Settings matching RabbitMQConfig.java
openfloat.rabbitmq.exchange=openfloat.erp.exchange
openfloat.rabbitmq.queue=openfloat.erp.queue
openfloat.rabbitmq.routing-key=erp.payment.success

# RabbitMQ Exponential Backoff & DLQ Policy
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=2000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ==========================================
# DATASOURCE & PERSISTENCE (POSTGRESQL)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://dpg-d9fgo3741pts73e5pui0-a.oregon-postgres.render.com/openfloat_db?sslmode=require}
spring.datasource.username=${DB_USERNAME:openfloat_db_user}
spring.datasource.password=${DB_PASSWORD:WUWGwK6ZpcjhXGn9smIgMFyUu0pbXJXX}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Dialect specifically for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Auto-create/update tables
spring.jpa.hibernate.ddl-auto=update

# Disable H2 Console
spring.h2.console.enabled=false



