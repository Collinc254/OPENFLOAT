spring.application.name=middleware

# ==========================================
# WEBHOOK ROUTING (DYNAMIC)
# ==========================================
# This determines where Safaricom sends callbacks. Defaults to Render if not set in .env
openfloat.webhook.base-url=${WEBHOOK_BASE_URL:https://openfloat.onrender.com}

# ==========================================
# RABBITMQ CONFIGURATION
# ==========================================
spring.rabbitmq.addresses=${RABBITMQ_URL}

openfloat.rabbitmq.exchange=openfloat.erp.exchange
openfloat.rabbitmq.queue=openfloat.webhook.queue
openfloat.rabbitmq.routing-key=erp.payment.success

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=2000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ==========================================
# DATASOURCE & PERSISTENCE (POSTGRESQL - NEON)
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

# --- HIKARI CONNECTION POOL FIX ---
spring.datasource.hikari.max-lifetime=270000
spring.datasource.hikari.keepalive-time=45000

# ==========================================
# SECURITY & ADMIN CREDENTIALS
# ==========================================
ADMIN_USERNAME=${ADMIN_USERNAME}
ADMIN_PASSWORD=${ADMIN_PASSWORD}

# ==========================================
# SAFARICOM DARAJA API SETTINGS
# ==========================================
safaricom.daraja.consumer-key=${SAFARICOM_CONSUMER_KEY}
safaricom.daraja.consumer-secret=${SAFARICOM_CONSUMER_SECRET}

safaricom.daraja.shortcode=${DARAJA_SHORTCODE}
safaricom.daraja.passkey=${DARAJA_PASSKEY}

# URLs can safely use fallbacks since they are public sandbox/production endpoints
safaricom.daraja.stk-push-url=${DARAJA_STK_PUSH_URL:https://sandbox.safaricom.co.ke/mpesa/stkpush/v1/processrequest}
safaricom.daraja.auth-url=${DARAJA_AUTH_URL:https://sandbox.safaricom.co.ke/oauth/v1/generate?grant_type=client_credentials}

# Dynamic STK Callback
safaricom.daraja.callback-url=${openfloat.webhook.base-url}/api/v1/payments/callback

# ==========================================
# Safaricom B2C Configuration
# ==========================================
safaricom.b2c.initiator-name=${SAFARICOM_B2C_INITIATOR_NAME}
safaricom.b2c.initiator-password=${SAFARICOM_B2C_INITIATOR_PASSWORD}
safaricom.b2c.shortcode=${SAFARICOM_B2C_SHORTCODE}

# Dynamic B2C Callbacks
safaricom.b2c.result-url=${openfloat.webhook.base-url}/api/v1/b2c/result
safaricom.b2c.timeout-url=${openfloat.webhook.base-url}/api/v1/b2c/timeout

# ==========================================
# REVERSALS & C2B REGISTRATION URLs
# ==========================================
safaricom.daraja.reversal-url=${DARAJA_REVERSAL_URL:https://sandbox.safaricom.co.ke/mpesa/reversal/v1/request}
safaricom.daraja.c2b-register-url=${DARAJA_C2B_REGISTER_URL:https://sandbox.safaricom.co.ke/mpesa/c2b/v1/registerurl}

# Dynamic Reversal Callbacks
safaricom.daraja.reversal-result-url=${openfloat.webhook.base-url}/api/v1/reversals/result
safaricom.daraja.reversal-timeout-url=${openfloat.webhook.base-url}/api/v1/reversals/timeout

# ==========================================
# SECURITY: SAFARICOM IP WHITELIST (Comma Separated)
# ==========================================
safaricom.daraja.allowed-ips=196.201.214.200,196.201.214.206,196.201.213.114,196.201.214.207,196.201.214.208,196.29.203.35,196.29.203.34,196.29.203.36,127.0.0.1

server.error.include-stacktrace=always
logging.level.com.openfloat.middleware=DEBUG

# ==========================================
# REDIS CONFIGURATION (IDEMPOTENCY CACHE)
# ==========================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ==========================================
# AES-256 COLUMN ENCRYPTION SECRET
# ==========================================
openfloat.security.encryption.secret=${ENCRYPTION_SECRET:OpenFloatAES256SecureKey!!2026xx}

# ==========================================
# ENTERPRISE IDENTITY (LDAP / ACTIVE DIRECTORY)
# ==========================================
openfloat.auth.strategy=${AUTH_STRATEGY:LOCAL}
spring.ldap.urls=${LDAP_URL:ldap://localhost:8389}
spring.ldap.base=${LDAP_BASE:dc=openfloat,dc=com}
spring.ldap.username=${LDAP_BIND_DN:cn=admin,dc=openfloat,dc=com}
spring.ldap.password=${LDAP_PASSWORD:admin}
openfloat.ldap.user-dn-pattern=${LDAP_USER_DN:uid={0},ou=people}



# RabbitMQ Metrics (Tracks queue depth and backlog)
management.metrics.enable.rabbitmq=true